[package]
name = "paletteer"
version = "0.1.0"
edition = "2024"

[[example]]
name = "benchmark"
path = "tools/benchmark.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
palette = "0.7"
rayon = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
webp = "0.3"
